[GPIO]
pin_number = 116
pressed = 0
unpressed = 1
# Для локальной разработки можно включить эмулятор:
value_path = "./var/alarm-button-gpio-value"

[alarm]
initial_state = true
debounce_ms = 50
min_press_ms = 150
repress_timeout_sec = 10

[emulator]
hold_ms = 400
interval_ms = 1200

[api-server]
api-host = "0.0.0.0"
api-port = 7130

[log]
log_dir = "./logs"
log_name = "alarm-button.log"
max_log_files = 5
max_log_size = "10M"
loglevel = "info"
